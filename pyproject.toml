[tool.poetry]
name = "rocrate-to-pages"
version = "v0.0.45-beta.9"
description = "This is a gh-action to generate a GitHub Pages site from a github repo containing a RO-Crate."
authors = ["Cedric Decruw <cedricdecruw@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]
license = "MIT"
repository = "https://github.com/vliz-be-opsci/rocrate-to-pages"


[tool.poetry.dependencies]
python = "^3.11"
pyyaml = "^6.0.4"
gitpython = "^3.2.1"
requests = "^2.34.2"
jinja2 = "^3.1.6"

# Development tools
pre-commit = {version = "^4.7.0", optional = true}
isort = {version = "^9.0.2", optional = true}
black = {version = "^26.10.1", optional = true}
flake8 = {version = "^7.5.0", optional = true}

# Testing tools
pytest = {version = "^9.2.0", optional = true}
coverage = {version = "^7.17.5", optional = true}
python-dotenv = {version = "^1.2.4", optional = true}
pytest-cov = {version = "^7.1.0", optional = true}

# Documentation tools
sphinx = {version = "^9.0.4", optional = true}

# Poetry has the dependecies groups, but those are not 
#   compatible with extras, widely used in the python-verse.
[tool.poetry.extras]
dev = ["pre-commit", "isort", "black", "flake8"]
tests = ["pyyaml","pytest", "coverage", "python-dotenv", "pytest-cov"]
docs = ["sphinx"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
combine_as_imports = true

[tool.pytest.ini_options]
testpaths = ["tests",]
pythonpath = ["."]
